name: Deploy Tailwind Site

on:
  push:
    branches:
      - main # Change this if your default branch is named 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 20

      - name: Install Tailwind
        run: npm install -D tailwindcss

      - name: Build Production CSS
        run: npx tailwindcss -i ./src/input.css -o ./dist/output.css --minify

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the root directory containing your HTML and the new dist folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
